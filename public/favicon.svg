<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Red background -->
  <rect width="48" height="48" fill="#ce1126"/>

  <!-- Gold Vergina Sun (simplified 16-ray star) -->
  <g transform="translate(24, 24)">
    <!-- Center circle -->
    <circle cx="0" cy="0" r="6" fill="#fcd116"/>

    <!-- 16 rays -->
    <g fill="#fcd116">
      <!-- Outer rays -->
      <polygon points="0,-15 2,-8 -2,-8"/>
      <polygon points="10.6,-10.6 7.5,-7.5 10.6,-5.3"/>
      <polygon points="15,-0 8,-2 8,2"/>
      <polygon points="10.6,10.6 10.6,5.3 7.5,7.5"/>
      <polygon points="0,15 -2,8 2,8"/>
      <polygon points="-10.6,10.6 -7.5,7.5 -10.6,5.3"/>
      <polygon points="-15,0 -8,2 -8,-2"/>
      <polygon points="-10.6,-10.6 -10.6,-5.3 -7.5,-7.5"/>
    </g>
  </g>
</svg>